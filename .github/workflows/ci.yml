name: CI

on: push

env:
  DATA_FIL: data/kundbas_ny_leverans.csv

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: pytest

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7 
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      
      - run: pip install -e "[.dev]"

      - run: python kontroller/schema.py "$DATA_FIL"

  train:
    needs: [test, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: python -m churn.model  

      
